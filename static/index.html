<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта киберугроз — РосИнфоБез</title>
<style>
  :root{
    --bg:#0A0A0A; --bg2:#101014; --panel:#141418; --line:#26262e;
    --yellow:#FFD400; --yellow-soft:#F5C518; --white:#F2F3F5; --muted:#8A8C96;
    --low:#22D3EE; --medium:#FFD400; --high:#FF8C1A; --critical:#FF2D6E;
    --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  body{background:
    radial-gradient(1200px 700px at 75% -10%, rgba(255,212,0,.06), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(255,45,110,.06), transparent 55%),
    var(--bg);}
  .app{display:flex;flex-direction:column;height:100vh}

  /* header + KPI */
  header{display:flex;align-items:center;gap:26px;padding:16px 26px;border-bottom:1px solid var(--line);
    flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px;min-width:260px}
  .logo{width:42px;height:42px;border-radius:11px;background:var(--yellow);display:grid;place-items:center;
    box-shadow:0 6px 26px rgba(255,212,0,.3)}
  .logo svg{width:24px;height:24px}
  h1{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
  h1 .y{color:var(--yellow)}
  .sub{color:var(--muted);font-size:12px;margin-top:2px;letter-spacing:.02em}
  .kpis{display:flex;gap:14px;flex:1;justify-content:flex-end;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 18px;min-width:128px}
  .kpi .n{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--yellow);line-height:1;
    text-shadow:0 0 18px rgba(255,212,0,.35)}
  .kpi .t{color:var(--muted);font-size:11px;margin-top:6px;text-transform:uppercase;letter-spacing:.09em}
  .kpi.crit .n{color:var(--critical);text-shadow:0 0 18px rgba(255,45,110,.4)}
  .tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#000;
    background:var(--yellow);padding:6px 11px;border-radius:999px}

  /* layout */
  .main{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
  .mapwrap{position:relative;min-height:0;overflow:hidden}
  #map{width:100%;height:100%;display:block}
  .land{fill:#16171d;stroke:#2c2e38;stroke-width:.5}
  .sphere{fill:#0c0d11;stroke:#23242c;stroke-width:1}
  .grat{fill:none;stroke:#1b1c22;stroke-width:.4}
  .hotspot{cursor:pointer}
  .hotspot .core{stroke:#000;stroke-width:.4}
  .hotspot .pulse{transform-origin:0 0;pointer-events:none}
  .hotspot.on .pulse{animation:pulse 2.3s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.5);opacity:.5}100%{transform:scale(3);opacity:0}}
  .sev-low .core{fill:var(--low)} .sev-low .pulse{fill:var(--low)}
  .sev-medium .core{fill:var(--medium)} .sev-medium .pulse{fill:var(--medium)}
  .sev-high .core{fill:var(--high)} .sev-high .pulse{fill:var(--high)}
  .sev-critical .core{fill:var(--critical)} .sev-critical .pulse{fill:var(--critical)}
  .glow-low{filter:drop-shadow(0 0 5px var(--low))}
  .glow-medium{filter:drop-shadow(0 0 5px var(--medium))}
  .glow-high{filter:drop-shadow(0 0 6px var(--high))}
  .glow-critical{filter:drop-shadow(0 0 7px var(--critical))}

  /* tooltip / detail popup */
  .tip{position:absolute;pointer-events:none;background:rgba(18,19,24,.97);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-size:13px;min-width:210px;opacity:0;transform:translateY(4px);
    transition:.12s;z-index:5;box-shadow:0 16px 50px rgba(0,0,0,.6)}
  .tip.show{opacity:1;transform:none}
  .tip .ip{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--yellow)}
  .tip .row{display:flex;justify-content:space-between;gap:18px;margin-top:5px;color:var(--muted)}
  .tip .row b{color:var(--white);font-weight:600}
  .tip .sevpill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:#000}
  .legend{position:absolute;left:16px;bottom:14px;display:flex;gap:14px;background:rgba(16,17,20,.8);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:11px;height:11px;border-radius:50%;display:inline-block}

  /* side panel */
  aside{border-left:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),var(--panel));
    display:flex;flex-direction:column;min-height:0}
  .block{padding:16px 18px;border-bottom:1px solid var(--line)}
  .block h2{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:12px;font-weight:700}
  .sevfilters{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid var(--line);
    background:#0e0f13;color:var(--muted);cursor:pointer;user-select:none;transition:.12s;display:flex;align-items:center;gap:7px}
  .chip i{width:9px;height:9px;border-radius:50%}
  .chip.active{color:var(--white);border-color:#3a3c46;background:#191a20}
  .chip.off{opacity:.4}
  .score{margin-top:15px}
  .score label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
  .score label b{color:var(--yellow);font-family:var(--mono)}
  input[type=range]{width:100%;accent-color:var(--yellow);cursor:pointer}

  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px;font-size:12px}
  .bar .name{color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{height:9px;background:#0e0f13;border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#F5C518,#FF8C1A);border-radius:6px;
    width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .bar .val{font-family:var(--mono);color:var(--muted);font-size:11px}

  .log{flex:1;min-height:0;display:flex;flex-direction:column}
  .log .list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:0}
  .ev{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:8px 4px;
    border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;animation:flash .9s ease-out}
  @keyframes flash{from{background:rgba(255,212,0,.12)}to{background:transparent}}
  .ev .tm{font-family:var(--mono);color:var(--muted);font-size:11px}
  .ev .ip{font-family:var(--mono);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .ip small{color:var(--muted)}
  .ev .sev{width:9px;height:9px;border-radius:50%;justify-self:end}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--critical);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--critical);animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5l8-3z" stroke="#000" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 8v4m0 3h.01" stroke="#000" stroke-width="1.9" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>Карта <span class="y">киберугроз</span></h1>
        <div class="sub">SOC-мониторинг вредоносных IP · в реальном времени</div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="n" id="kAttacks">0</div><div class="t">Всего атак</div></div>
      <div class="kpi"><div class="n" id="kIps">0</div><div class="t">Уникальных IP</div></div>
      <div class="kpi"><div class="n" id="kCountries">0</div><div class="t">Затронуто стран</div></div>
      <div class="kpi crit"><div class="n" id="kCrit">0</div><div class="t">Крит. инцидентов</div></div>
    </div>
    <span class="tag">РосИнфоБез</span>
  </header>

  <div class="main">
    <div class="mapwrap">
      <svg id="map"></svg>
      <div class="tip" id="tip"></div>
      <div class="legend">
        <span><i style="background:var(--low)"></i>низкая</span>
        <span><i style="background:var(--medium)"></i>средняя</span>
        <span><i style="background:var(--high)"></i>высокая</span>
        <span><i style="background:var(--critical)"></i>критическая</span>
      </div>
    </div>

    <aside>
      <div class="block">
        <h2>Фильтр угроз</h2>
        <div class="sevfilters" id="sevFilters">
          <div class="chip active" data-sev="low"><i style="background:var(--low)"></i>низкая</div>
          <div class="chip active" data-sev="medium"><i style="background:var(--medium)"></i>средняя</div>
          <div class="chip active" data-sev="high"><i style="background:var(--high)"></i>высокая</div>
          <div class="chip active" data-sev="critical"><i style="background:var(--critical)"></i>критич.</div>
        </div>
        <div class="score">
          <label>Threat-score (мин. атак) <b id="scoreVal">0</b></label>
          <input type="range" id="score" min="0" max="5000" step="100" value="0">
        </div>
      </div>

      <div class="block">
        <h2>Топ-5 стран по атакам</h2>
        <div class="bars" id="bars"></div>
      </div>

      <div class="block log">
        <h2 style="display:flex;justify-content:space-between;align-items:center">
          Live Threat Log <span class="live"><i></i>live</span>
        </h2>
        <div class="list" id="log"></div>
      </div>
    </aside>
  </div>
</div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
(function(){
  "use strict";
  const SEV = {low:'низкая', medium:'средняя', high:'высокая', critical:'критическая'};
  const SEV_COLOR = {low:'#22D3EE', medium:'#FFD400', high:'#FF8C1A', critical:'#FF2D6E'};
  const $ = (id)=>document.getElementById(id);
  const fmt = (n)=> n.toLocaleString('ru-RU');

  let THREATS = [];
  let WORLD = null;
  const active = new Set(['low','medium','high','critical']);
  let minScore = 0;

  const svg = d3.select('#map');
  let projection, path, gPoints, gMap, W=0, H=0;

  function filtered(){
    return THREATS.filter(t => active.has(t.severity) && (t.count||t.attacks) >= minScore);
  }

  // ---------- карта ----------
  function setupMap(){
    const land = topojson.feature(WORLD, WORLD.objects.countries);
    gMap = svg.append('g');
    gPoints = svg.append('g');
    drawStatic = ()=>{
      const wrap = $('map').getBoundingClientRect();
      W = wrap.width; H = wrap.height;
      svg.attr('viewBox', `0 0 ${W} ${H}`);
      projection = d3.geoNaturalEarth1().fitExtent([[10,10],[W-10,H-10]], {type:'Sphere'});
      path = d3.geoPath(projection);
      gMap.selectAll('*').remove();
      gMap.append('path').attr('class','sphere').attr('d', path({type:'Sphere'}));
      gMap.append('path').attr('class','grat').attr('d', path(d3.geoGraticule10()));
      gMap.append('path').attr('class','land').attr('d', path(land));
      renderPoints();
    };
    drawStatic();
    window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(drawStatic,150); });
  }
  let drawStatic = ()=>{};

  function rScale(count){ return 2.2 + Math.sqrt(count) * 0.085; }

  function renderPoints(){
    const data = filtered().map(t=>{
      const p = projection([t.lon, t.lat]); return p ? {...t, x:p[0], y:p[1]} : null;
    }).filter(Boolean).sort((a,b)=>(a.count-b.count)); // крупные сверху
    const sel = gPoints.selectAll('g.hotspot').data(data, d=>d.ip);
    sel.exit().remove();
    const enter = sel.enter().append('g')
      .attr('class', d=>`hotspot sev-${d.severity} glow-${d.severity}${(d.severity==='high'||d.severity==='critical')?' on':''}`)
      .on('mousemove', showTip).on('mouseleave', hideTip).on('click', showTip);
    enter.append('circle').attr('class','pulse').attr('r', d=>rScale(d.count));
    enter.append('circle').attr('class','core').attr('r', d=>rScale(d.count));
    gPoints.selectAll('g.hotspot')
      .attr('transform', d=>`translate(${d.x},${d.y})`)
      .attr('class', d=>`hotspot sev-${d.severity} glow-${d.severity}${(d.severity==='high'||d.severity==='critical')?' on':''}`);
  }

  // ---------- tooltip ----------
  function showTip(event, d){
    const tip = $('tip');
    tip.innerHTML = `
      <div class="ip">${d.ip}</div>
      <div class="row"><span>Страна</span><b>${d.country} (${d.countryCode})</b></div>
      <div class="row"><span>Атак</span><b>${fmt(d.attacks)}</b></div>
      <div class="row"><span>Инцидентов</span><b>${fmt(d.incidents)}</b></div>
      <div class="row"><span>Порты</span><b>${(d.ports||[]).join(', ')||'—'}</b></div>
      <div class="row"><span>Уровень</span><span class="sevpill" style="background:${SEV_COLOR[d.severity]}">${SEV[d.severity]}</span></div>`;
    tip.classList.add('show');
    const wrap = $('map').getBoundingClientRect();
    let x = d.x + 16, y = d.y + 12;
    if(x + 230 > wrap.width) x = d.x - 226;
    if(y + 150 > wrap.height) y = d.y - 150;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip(){ $('tip').classList.remove('show'); }

  // ---------- KPI ----------
  function countUp(el, to){
    const dur=900, start=performance.now(), from=0;
    function step(now){
      const p=Math.min((now-start)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent = fmt(Math.round(from + (to-from)*e));
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function updateKpis(){
    const f = filtered();
    countUp($('kAttacks'), d3.sum(f, d=>d.attacks));
    countUp($('kIps'), new Set(f.map(d=>d.ip)).size);
    countUp($('kCountries'), new Set(f.map(d=>d.country)).size);
    countUp($('kCrit'), d3.sum(f.filter(d=>d.severity==='critical'), d=>d.incidents));
  }

  // ---------- топ стран ----------
  function updateBars(){
    const f = filtered();
    const byCountry = Array.from(d3.rollup(f, v=>d3.sum(v,d=>d.attacks), d=>d.country), ([k,v])=>({country:k,att:v}))
      .sort((a,b)=>b.att-a.att).slice(0,5);
    const max = d3.max(byCountry, d=>d.att) || 1;
    $('bars').innerHTML = byCountry.map(c=>`
      <div class="bar"><div class="name">${c.country}</div>
        <div class="track"><div class="fill" data-w="${(c.att/max*100).toFixed(1)}"></div></div>
        <div class="val">${fmt(c.att)}</div></div>`).join('') || '<div style="color:var(--muted);font-size:12px">Нет данных под фильтром</div>';
    requestAnimationFrame(()=>document.querySelectorAll('.bar .fill').forEach(f=>f.style.width=f.dataset.w+'%'));
  }

  // ---------- live log ----------
  function pad(n){ return String(n).padStart(2,'0'); }
  let logTimer=null, clock=0;
  function pushEvent(){
    const f = filtered(); if(!f.length) return;
    const d = f[Math.floor(Math.pow(Math.random(),1.5)*f.length)]; // чаще крупные (отсортированы по возр.)
    clock = (clock + 7 + Math.floor(Math.random()*53)) % 86400;
    const hh=pad(Math.floor(clock/3600)), mm=pad(Math.floor(clock%3600/60)), ss=pad(clock%60);
    const row = document.createElement('div'); row.className='ev';
    row.innerHTML = `<span class="tm">${hh}:${mm}:${ss}</span>
      <span class="ip">${d.ip} <small>${d.countryCode}</small></span>
      <span class="sev" style="background:${SEV_COLOR[d.severity]}"></span>`;
    const list = $('log');
    list.prepend(row);
    while(list.children.length > 14) list.removeChild(list.lastChild);
    schedule();
  }
  function schedule(){ clearTimeout(logTimer); logTimer=setTimeout(pushEvent, 2000 + Math.random()*2000); }

  // ---------- фильтры ----------
  function refreshAll(){ renderPoints(); updateKpis(); updateBars(); }
  function setupFilters(){
    $('sevFilters').addEventListener('click', e=>{
      const chip = e.target.closest('.chip'); if(!chip) return;
      const sev = chip.dataset.sev;
      if(active.has(sev)){ active.delete(sev); chip.classList.add('off'); chip.classList.remove('active'); }
      else { active.add(sev); chip.classList.remove('off'); chip.classList.add('active'); }
      refreshAll();
    });
    $('score').addEventListener('input', e=>{
      minScore = +e.target.value; $('scoreVal').textContent = fmt(minScore); refreshAll();
    });
  }

  // ---------- старт ----------
  Promise.all([
    fetch('data/threats.json').then(r=>r.json()),
    fetch('vendor/world-110m.json').then(r=>r.json())
  ]).then(([threats, world])=>{
    THREATS = threats; WORLD = world;
    setupMap(); setupFilters();
    updateKpis(); updateBars();
    schedule();
  }).catch(err=>{
    document.querySelector('.mapwrap').insertAdjacentHTML('beforeend',
      `<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--critical);font-family:var(--mono)">Ошибка загрузки данных: ${err.message}</div>`);
  });
})();
</script>
</body>
</html>
