<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC — Тепловая карта вредоносных IP</title>
<style>
  :root{
    --bg:#0A0A0A; --bg2:#141414; --panel:#121212; --line:#262626;
    --txt:#F2F2F2; --muted:#8A8A8A; --accent:#FFD400; --accent2:#F5C518;
    --low:#00E5B0; --medium:#FFD400; --high:#FF8A00; --critical:#FF2D6E;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;}
  body{display:flex;flex-direction:column;}

  /* ===== Header ===== */
  header{
    display:flex;align-items:center;gap:24px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#161616,#0d0d0d);
  }
  .brand{display:flex;flex-direction:column;line-height:1.1;min-width:200px;}
  .brand .t1{font-weight:800;font-size:18px;letter-spacing:.5px;}
  .brand .t1 b{color:var(--accent);}
  .brand .t2{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:1px;}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--low);font-family:var(--mono);font-size:11px;}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--low);box-shadow:0 0 8px var(--low);animation:blink 1.4s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  .kpis{display:flex;gap:14px;flex:1;flex-wrap:wrap;justify-content:center;}
  .kpi{
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:10px 18px;min-width:140px;text-align:center;position:relative;overflow:hidden;
  }
  .kpi::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6;}
  .kpi .val{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent);text-shadow:0 0 14px rgba(255,212,0,.35);}
  .kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}
  .kpi.crit .val{color:var(--critical);text-shadow:0 0 14px rgba(255,45,110,.45);}

  .btn{
    background:var(--accent);color:#1a1500;border:none;border-radius:8px;
    padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
    box-shadow:0 0 0 rgba(255,212,0,.0);transition:box-shadow .2s,transform .05s;
  }
  .btn:hover{box-shadow:0 0 18px rgba(255,212,0,.4);}
  .btn:active{transform:translateY(1px);}

  /* ===== Layout ===== */
  main{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0;}
  #map{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 40%,#0f1418,#070707 70%);}
  #map svg{width:100%;height:100%;display:block;}

  .sphere{fill:#0a0f14;}
  .graticule{fill:none;stroke:#1b2730;stroke-width:.5;stroke-opacity:.5;}
  .country{fill:#15191d;stroke:#2b3640;stroke-width:.5;}
  .country:hover{fill:#1d242a;}

  .pt{cursor:pointer;}
  .pt .core{stroke:#0a0a0a;stroke-width:.4;}
  .pt.s-high .glow,.pt.s-critical .glow{animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.6);opacity:.7}70%{opacity:0}100%{transform:scale(2.4);opacity:0}}

  /* ===== Popup ===== */
  #popup{
    position:absolute;z-index:20;min-width:210px;pointer-events:none;
    background:rgba(16,16,16,.96);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:8px;padding:12px 14px;font-size:12px;display:none;
    box-shadow:0 8px 30px rgba(0,0,0,.6);backdrop-filter:blur(4px);
  }
  #popup .ip{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);margin-bottom:6px;}
  #popup .row{display:flex;justify-content:space-between;gap:18px;padding:2px 0;color:var(--muted);}
  #popup .row b{color:var(--txt);font-family:var(--mono);}
  #popup .sev{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}

  /* ===== Side panel ===== */
  aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .panel{padding:14px 16px;border-bottom:1px solid var(--line);}
  .panel h3{margin:0 0 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .panel h3 b{color:var(--accent);}

  .sevfilters{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;user-select:none;
    border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:var(--bg2);transition:.15s;
  }
  .chip .sw{width:9px;height:9px;border-radius:50%;}
  .chip.off{opacity:.35;}
  .chip:hover{border-color:#3a3a3a;}

  .slider{margin-top:14px;}
  .slider .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;font-family:var(--mono);}
  .slider .lab b{color:var(--accent);}
  input[type=range]{width:100%;accent-color:var(--accent);}

  .bars{display:flex;flex-direction:column;gap:9px;}
  .bar{font-size:12px;}
  .bar .top{display:flex;justify-content:space-between;margin-bottom:3px;}
  .bar .name{color:var(--txt);}
  .bar .num{font-family:var(--mono);color:var(--muted);}
  .bar .track{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px rgba(255,212,0,.3);transition:width .5s;}

  .logwrap{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:0;}
  #log{flex:1;overflow-y:auto;font-family:var(--mono);font-size:11px;line-height:1.5;padding-right:4px;}
  #log .e{display:grid;grid-template-columns:54px 1fr auto;gap:8px;padding:4px 0;border-bottom:1px solid #1a1a1a;align-items:center;animation:slidein .3s ease;}
  #log .e .tm{color:var(--muted);}
  #log .e .meta{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #log .e .meta i{color:var(--muted);font-style:normal;}
  #log .e .tag{font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:10px;}
  @keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  #log::-webkit-scrollbar{width:6px;}#log::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px;}

  /* ===== toast / errors ===== */
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;
    max-width:420px;padding:12px 18px;border-radius:10px;font-size:13px;display:none;
    background:#1a1212;border:1px solid var(--critical);color:#ffd9e4;box-shadow:0 8px 30px rgba(0,0,0,.6);
  }
  #toast.ok{background:#0f1a14;border-color:var(--low);color:#c7ffe9;}

  /* ===== Responsive (mobile portrait) ===== */
  @media (max-width:820px){
    html,body{overflow:auto;}
    header{padding:12px 14px;gap:14px;}
    .kpis{order:3;width:100%;gap:8px;}
    .kpi{min-width:0;flex:1 1 40%;padding:8px 6px;}
    .kpi .val{font-size:20px;}
    main{grid-template-columns:1fr;}
    #map{height:54vh;}
    aside{border-left:none;border-top:1px solid var(--line);}
    .logwrap{height:300px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="t1">SOC · <b>Тепловая карта</b> угроз</span>
    <span class="t2">REAL-TIME THREAT INTELLIGENCE</span>
    <span class="live"><span class="dot"></span> LIVE · мониторинг активен</span>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="val" id="kpiAttacks">0</div><div class="lab">Всего атак</div></div>
    <div class="kpi"><div class="val" id="kpiIps">0</div><div class="lab">Уникальных IP</div></div>
    <div class="kpi"><div class="val" id="kpiCountries">0</div><div class="lab">Стран затронуто</div></div>
    <div class="kpi crit"><div class="val" id="kpiCrit">0</div><div class="lab">Крит. инцидентов</div></div>
  </div>

  <button class="btn" id="importBtn">Импорт JSON / CSV</button>
  <input type="file" id="fileInput" accept=".json,.csv" hidden>
</header>

<main>
  <div id="map">
    <svg id="svg"></svg>
    <div id="popup"></div>
  </div>

  <aside>
    <div class="panel">
      <h3>Фильтр по <b>severity</b></h3>
      <div class="sevfilters" id="sevFilters"></div>
      <div class="slider">
        <div class="lab"><span>Порог threat-score (атак ≥)</span><b id="scoreVal">0</b></div>
        <input type="range" id="scoreSlider" min="0" max="5000" value="0" step="50">
      </div>
    </div>

    <div class="panel">
      <h3>Топ-5 стран по атакам</h3>
      <div class="bars" id="bars"></div>
    </div>

    <div class="panel logwrap">
      <h3>Live Threat <b>Log</b></h3>
      <div id="log"></div>
    </div>
  </aside>
</main>

<div id="toast"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
(function(){
  "use strict";

  const SEV = {
    low:      {color:"#00E5B0", label:"low"},
    medium:   {color:"#FFD400", label:"medium"},
    high:     {color:"#FF8A00", label:"high"},
    critical: {color:"#FF2D6E", label:"critical"},
  };
  const SEV_ORDER = ["low","medium","high","critical"];

  // ---- state ----
  let ALL = [];                 // полный датасет
  let FILTERED = [];            // после фильтров
  let activeSev = new Set(SEV_ORDER);
  let minScore = 0;
  let world = null, countries = null;
  let projection, pathGen, svg, gRoot, gMap, gPoints, zoom;
  let logTimer = null;

  const $ = s => document.querySelector(s);
  const fmt = n => Math.round(n).toLocaleString("ru-RU");

  // ================= MAP =================
  function setupMap(){
    svg = d3.select("#svg");
    gRoot = svg.append("g");
    gMap = gRoot.append("g");
    gPoints = gRoot.append("g");

    projection = d3.geoNaturalEarth1();
    pathGen = d3.geoPath(projection);

    zoom = d3.zoom().scaleExtent([1, 8]).on("zoom", (ev)=>{
      gRoot.attr("transform", ev.transform);
      gMap.selectAll(".country,.graticule,.sphere").attr("stroke-width", 0.5/ev.transform.k);
      gPoints.selectAll(".pt").attr("transform", d => {
        const p = projection([d.lon, d.lat]);
        return `translate(${p[0]},${p[1]}) scale(${1/ev.transform.k})`;
      });
      hidePopup();
    });
    svg.call(zoom).on("dblclick.zoom", null);
  }

  function drawMap(){
    const el = $("#map");
    const w = el.clientWidth, h = el.clientHeight;
    svg.attr("viewBox", `0 0 ${w} ${h}`);

    projection.fitExtent([[10,10],[w-10,h-10]], countries);

    gMap.selectAll("*").remove();
    gMap.append("path").attr("class","sphere").attr("d", pathGen({type:"Sphere"}));
    gMap.append("path").attr("class","graticule").attr("d", pathGen(d3.geoGraticule10()));
    gMap.append("g").selectAll("path")
      .data(countries.features).enter().append("path")
      .attr("class","country").attr("d", pathGen);

    drawPoints();
  }

  function radius(d){
    const max = d3.max(ALL, x=>x.count) || 1;
    return 3 + 11 * Math.sqrt(d.count / max);
  }

  function drawPoints(){
    const k = d3.zoomTransform(svg.node()).k || 1;
    const sel = gPoints.selectAll(".pt").data(FILTERED, d=>d.ip);
    sel.exit().remove();

    const g = sel.enter().append("g")
      .attr("class", d=>"pt s-"+d.severity)
      .on("click", (ev,d)=>{ ev.stopPropagation(); showPopup(ev,d); });

    g.append("circle").attr("class","glow");
    g.append("circle").attr("class","core");

    const all = g.merge(sel);
    all.attr("class", d=>"pt s-"+d.severity)
       .attr("transform", d=>{ const p=projection([d.lon,d.lat]); return `translate(${p[0]},${p[1]}) scale(${1/k})`; });
    all.select(".glow")
       .attr("r", d=>radius(d)*1.9)
       .attr("fill", d=>SEV[d.severity].color)
       .attr("opacity", .18)
       .style("filter","blur(2px)")
       .style("transform-box","fill-box")
       .style("transform-origin","center");
    all.select(".core")
       .attr("r", radius)
       .attr("fill", d=>SEV[d.severity].color)
       .style("filter", d=>`drop-shadow(0 0 ${radius(d)/1.5}px ${SEV[d.severity].color})`);
  }

  // ================= POPUP =================
  function showPopup(ev, d){
    const p = $("#popup");
    const c = SEV[d.severity].color;
    p.innerHTML = `
      <div class="ip">${d.ip}</div>
      <div class="row"><span>Страна</span><b>${d.country} (${d.countryCode})</b></div>
      <div class="row"><span>Атак</span><b>${fmt(d.attacks)}</b></div>
      <div class="row"><span>Инцидентов</span><b>${fmt(d.incidents)}</b></div>
      <div class="row"><span>Порты</span><b>${(d.ports||[]).join(", ")||"—"}</b></div>
      <div class="row" style="margin-top:6px"><span>Severity</span>
        <span class="sev" style="background:${c}22;color:${c};border:1px solid ${c}">${d.severity}</span></div>`;
    p.style.borderLeftColor = c;
    p.style.display = "block";
    const map = $("#map").getBoundingClientRect();
    let x = ev.clientX - map.left + 14;
    let y = ev.clientY - map.top + 14;
    if(x + p.offsetWidth > map.width)  x = ev.clientX - map.left - p.offsetWidth - 14;
    if(y + p.offsetHeight > map.height) y = map.height - p.offsetHeight - 8;
    p.style.left = x+"px"; p.style.top = Math.max(8,y)+"px";
  }
  function hidePopup(){ $("#popup").style.display="none"; }

  // ================= KPI =================
  function countUp(el, to){
    const from = +el.dataset.v || 0;
    el.dataset.v = to;
    const t0 = performance.now(), dur = 700;
    (function step(t){
      const k = Math.min(1,(t-t0)/dur);
      const e = 1-Math.pow(1-k,3);
      el.textContent = fmt(from + (to-from)*e);
      if(k<1) requestAnimationFrame(step);
    })(performance.now());
  }
  function updateKPI(){
    const attacks = d3.sum(FILTERED, d=>d.attacks);
    const ips = FILTERED.length;
    const countries = new Set(FILTERED.map(d=>d.countryCode)).size;
    const crit = d3.sum(FILTERED.filter(d=>d.severity==="critical"), d=>d.incidents);
    countUp($("#kpiAttacks"), attacks);
    countUp($("#kpiIps"), ips);
    countUp($("#kpiCountries"), countries);
    countUp($("#kpiCrit"), crit);
  }

  // ================= TOP-5 =================
  function updateBars(){
    const byC = d3.rollups(FILTERED, v=>d3.sum(v,d=>d.attacks), d=>d.country)
                  .sort((a,b)=>b[1]-a[1]).slice(0,5);
    const max = d3.max(byC, d=>d[1]) || 1;
    $("#bars").innerHTML = byC.map(([name,val])=>`
      <div class="bar">
        <div class="top"><span class="name">${name}</span><span class="num">${fmt(val)}</span></div>
        <div class="track"><div class="fill" style="width:${(val/max*100).toFixed(1)}%"></div></div>
      </div>`).join("") || `<div class="num" style="color:var(--muted);font-size:12px">Нет данных</div>`;
  }

  // ================= FILTERS =================
  function buildSevFilters(){
    $("#sevFilters").innerHTML = SEV_ORDER.map(s=>`
      <span class="chip" data-sev="${s}">
        <span class="sw" style="background:${SEV[s].color};box-shadow:0 0 8px ${SEV[s].color}"></span>${s}
      </span>`).join("");
    document.querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const s = chip.dataset.sev;
        if(activeSev.has(s)){ activeSev.delete(s); chip.classList.add("off"); }
        else { activeSev.add(s); chip.classList.remove("off"); }
        applyFilters();
      };
    });
  }
  function applyFilters(){
    FILTERED = ALL.filter(d => activeSev.has(d.severity) && d.count >= minScore);
    drawPoints(); updateKPI(); updateBars();
  }

  // ================= LIVE LOG =================
  function logEvent(d){
    const c = SEV[d.severity].color;
    const now = new Date();
    const tm = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
    const row = document.createElement("div");
    row.className = "e";
    row.innerHTML = `<span class="tm">${tm}</span>
      <span class="meta">${d.ip} <i>· ${d.country}</i></span>
      <span class="tag" style="background:${c}22;color:${c}">${d.severity}</span>`;
    const log = $("#log");
    log.prepend(row);
    while(log.children.length > 60) log.removeChild(log.lastChild);
  }
  function startLog(){
    if(logTimer) clearTimeout(logTimer);
    (function tick(){
      if(FILTERED.length){
        const d = FILTERED[Math.floor(Math.random()*FILTERED.length)];
        logEvent(d);
      }
      logTimer = setTimeout(tick, 2000 + Math.random()*2000);
    })();
  }

  // ================= IMPORT =================
  function toast(msg, ok){
    const t = $("#toast");
    t.textContent = msg; t.className = ok?"ok":"";
    t.style.display = "block";
    clearTimeout(t._t); t._t = setTimeout(()=>t.style.display="none", 4500);
  }
  function validate(rec){
    if(!rec || typeof rec!=="object") return null;
    const ip = String(rec.ip||"").trim();
    const lat = parseFloat(rec.lat), lon = parseFloat(rec.lon);
    const sev = String(rec.severity||"").trim().toLowerCase();
    if(!ip || !Number.isFinite(lat) || !Number.isFinite(lon) || !SEV[sev]) return null;
    let ports = rec.ports;
    if(typeof ports==="string") ports = ports.split(/[;|,]/).map(x=>parseInt(x,10)).filter(Number.isFinite);
    else if(Array.isArray(ports)) ports = ports.map(x=>parseInt(x,10)).filter(Number.isFinite);
    else ports = [];
    return {
      ip, lat, lon, severity:sev,
      country: String(rec.country||"—"),
      countryCode: String(rec.countryCode||"").toUpperCase(),
      count: parseFloat(rec.count)||0,
      attacks: parseFloat(rec.attacks)|| parseFloat(rec.count)||0,
      incidents: parseInt(rec.incidents,10)||0,
      ports,
    };
  }
  function parseCSV(text){
    const lines = text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
    if(!lines.length) return [];
    const head = lines[0].split(",").map(h=>h.trim());
    return lines.slice(1).map(line=>{
      const cells = line.split(",");
      const o = {};
      head.forEach((h,i)=> o[h] = (cells[i]||"").trim());
      return o;
    });
  }
  function importFile(file){
    const name = file.name.toLowerCase();
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        let raw;
        if(name.endsWith(".json")) raw = JSON.parse(e.target.result);
        else if(name.endsWith(".csv")) raw = parseCSV(e.target.result);
        else { toast("Неподдерживаемый формат: нужен .json или .csv"); return; }
        if(!Array.isArray(raw) || !raw.length){ toast("Пустой файл или неверная структура"); return; }
        const total = raw.length;
        const clean = raw.map(validate).filter(Boolean);
        if(!clean.length){ toast("Нет валидных записей: проверьте обязательные поля"); return; }
        loadData(clean);
        const skipped = total - clean.length;
        toast(`Импортировано ${clean.length} из ${total}` + (skipped?` · пропущено ${skipped}`:"") , true);
      }catch(err){
        toast("Ошибка разбора файла: "+err.message);
      }
    };
    reader.onerror = ()=>toast("Не удалось прочитать файл");
    reader.readAsText(file, "utf-8");
  }

  // ================= LOAD / INIT =================
  function loadData(data){
    ALL = data;
    const maxC = d3.max(ALL, d=>d.count) || 5000;
    const slider = $("#scoreSlider");
    slider.max = maxC; slider.value = 0; minScore = 0; $("#scoreVal").textContent = "0";
    activeSev = new Set(SEV_ORDER);
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("off"));
    $("#log").innerHTML = "";
    applyFilters();
    startLog();
  }

  async function init(){
    buildSevFilters();
    setupMap();

    $("#importBtn").onclick = ()=> $("#fileInput").click();
    $("#fileInput").onchange = e=>{ if(e.target.files[0]) importFile(e.target.files[0]); e.target.value=""; };
    $("#scoreSlider").oninput = e=>{ minScore = +e.target.value; $("#scoreVal").textContent = fmt(minScore); applyFilters(); };
    $("#map").addEventListener("click", hidePopup);
    window.addEventListener("resize", ()=>{ hidePopup(); if(countries) drawMap(); });

    try{
      world = await d3.json("vendor/world-110m.json");
      countries = topojson.feature(world, world.objects.countries);
    }catch(err){ toast("Не удалось загрузить карту мира"); return; }

    let data;
    try{ data = await d3.json("data/threats.json"); }
    catch(err){ toast("Не удалось загрузить датасет угроз"); data = []; }

    drawMap();
    loadData(data);
  }

  init();
})();
</script>
</body>
</html>
